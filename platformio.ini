; PlatformIO Project Configuration File
; EDwIC 2.3 - Telegram Bot for ESP8266
;
; Build with: platformio run
; Upload with: platformio run --target upload
; Upload SPIFFS: platformio run --target uploadfs
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino

; Локальні бібліотеки з папки lib/ (пріоритет)
lib_extra_dirs = lib

; Серіал монітор
monitor_speed = 115200

; Частота процесора
board_build.f_cpu = 80000000L

; Розмір LittleFS (4MB Flash, 2MB FS)
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs

; Опції компіляції
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D ESP_DEBUG_MODE=1
    -Wno-write-strings
    -D USE_QR_CODE

; Додаткові бібліотеки
lib_deps =
    milesburton/DallasTemperature@^4.0.3
    paulstoffregen/OneWire@^2.3.7
    paulstoffregen/Time@^1.6.1
    bblanchon/ArduinoJson@^7.0.0
    sstaub/NTP@^1.6.0
    gyverlibs/FastBot2@^1.1.0
    adafruit/Adafruit BME280 Library @ ^2.2.4
    gyverlibs/GyverHTU21D@^1.0
    ricmoo/QRCode@^0.0.1

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
lib_extra_dirs = lib
monitor_speed = 115200
board_build.f_cpu = 80000000L
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D ESP_DEBUG_MODE=1
    -Wno-write-strings
    -D USE_QR_CODE
lib_deps =
    milesburton/DallasTemperature@^4.0.3
    paulstoffregen/OneWire@^2.3.7
    paulstoffregen/Time@^1.6.1
    bblanchon/ArduinoJson@^7.0.0
    sstaub/NTP@^1.6.0
    gyverlibs/FastBot2@^1.0.10
    adafruit/Adafruit BME280 Library @ ^2.2.4
    gyverlibs/GyverHTU21D@^1.0
    ricmoo/QRCode@^0.0.1
